suite: test API GitHub secret
templates:
  - api-github-secret.yaml
tests:
  - it: omits the secret when GitHub authorization is disabled
    asserts:
      - hasDocuments:
          count: 0

  - it: projects the GitHub client secret
    set:
      api:
        enabled: true
        github:
          enabled: true
          clientSecret:
            remoteRef:
              key: arn:aws:secretsmanager:us-west-2:471112759938:secret:/argus/shared/agent-registry/github
              property: GITHUB_CLIENT_SECRET
    asserts:
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: agent-registry-api-github
      - equal:
          path: spec.secretStoreRef
          value:
            name: aws-secretsmanager
            kind: ClusterSecretStore
      - equal:
          path: spec.data[0]
          value:
            secretKey: GITHUB_CLIENT_SECRET
            remoteRef:
              key: arn:aws:secretsmanager:us-west-2:471112759938:secret:/argus/shared/agent-registry/github
              property: GITHUB_CLIENT_SECRET
