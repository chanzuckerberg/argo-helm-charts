{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-registry-api
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - agents.czi.team
    resources:
      - agentprofiles
      - agents
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - create
      - get
      - list
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - create
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    resourceNames:
      - agent-registry-api-owner-secrets
    verbs:
      - get
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - agent-registry-api-owner-secrets
    verbs:
      - bind
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-registry-api
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-registry-api
subjects:
  - kind: ServiceAccount
    name: {{ .Values.stack.services.api.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-registry-api-owner-secrets
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-registry-api-owner-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-registry-api-owner-secrets
subjects:
  - kind: ServiceAccount
    name: {{ .Values.stack.services.api.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
