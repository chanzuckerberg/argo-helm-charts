apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-registry-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-registry-operator-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-registry-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
{{- $root := . }}
{{- $namespaces := .Values.managedNamespaces }}
{{- if not $namespaces }}
{{- $namespaces = list .Release.Namespace }}
{{- end }}
{{- range $namespace := $namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-registry-operator
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-registry-operator.labels" $root | nindent 4 }}
rules:
  - apiGroups:
      - agents.czi.team
    resources:
      - agentprofiles
      - agents
    verbs:
      - get
      - list
      - watch
      - update
      - patch
  - apiGroups:
      - agents.czi.team
    resources:
      - agents
    verbs:
      - delete
  - apiGroups:
      - agents.czi.team
    resources:
      - agentprofiles/status
      - agents/status
    verbs:
      - get
      - update
      - patch
  - apiGroups:
      - agents.czi.team
    resources:
      - agentprofiles/finalizers
      - agents/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - ""
    resources:
      - configmaps
      - persistentvolumeclaims
      - serviceaccounts
      - services
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - statefulsets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-registry-operator
  namespace: {{ $namespace }}
  labels:
    {{- include "agent-registry-operator.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-registry-operator
subjects:
  - kind: ServiceAccount
    name: {{ $root.Values.serviceAccount.name }}
    namespace: {{ $root.Release.Namespace }}
{{- end }}
