{{- if and .Values.api.enabled .Values.api.github.enabled }}
{{- $remoteRef := .Values.api.github.clientSecret.remoteRef }}
{{- $_ := required "api.github.clientSecret.remoteRef.key is required" $remoteRef.key }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agent-registry-api-github
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    {{- toYaml .Values.api.github.clientSecret.secretStoreRef | nindent 4 }}
  target:
    name: agent-registry-api-github
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GITHUB_CLIENT_SECRET
      remoteRef:
        {{- toYaml $remoteRef | nindent 8 }}
{{- end }}
