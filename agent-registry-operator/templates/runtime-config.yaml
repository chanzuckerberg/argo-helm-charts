{{- if .Values.runtime.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-registry-runtime-source
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
data:
  {{- range $name, $contents := .Values.runtime.config }}
  {{ $name }}: |
{{ $contents | indent 4 }}
  {{- end }}
{{- end }}
