{{- $tag := required "image.tag is required" .Values.image.tag }}
{{- $watchNamespaces := required "watchNamespaces is required" .Values.watchNamespaces }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-registry-operator.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-registry-operator.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agent-registry-operator.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ printf "%s:%s" .Values.image.repository $tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WATCH_NAMESPACES
              value: {{ join "," $watchNamespaces | quote }}
            - name: AWS_RECONCILIATION_ENABLED
              value: {{ .Values.providers.aws.enabled | quote }}
            - name: ANTHROPIC_RECONCILIATION_ENABLED
              value: {{ .Values.providers.anthropic.enabled | quote }}
            - name: TAILSCALE_RECONCILIATION_ENABLED
              value: {{ .Values.providers.tailscale.enabled | quote }}
            - name: RUNTIME_RECONCILIATION_ENABLED
              value: {{ .Values.runtime.enabled | quote }}
            {{- if or .Values.providers.aws.enabled .Values.runtime.enabled }}
            - name: AWS_REGION
              value: {{ ternary .Values.providers.aws.region .Values.runtime.awsRegion .Values.providers.aws.enabled | quote }}
            {{- end }}
            {{- if .Values.providers.aws.enabled }}
            - name: AWS_CLUSTER_OIDC_PROVIDER
              value: {{ required "providers.aws.clusterOIDCProvider is required" .Values.providers.aws.clusterOIDCProvider | quote }}
            - name: AWS_PROVISIONER_ROLE_NAME
              value: {{ .Values.providers.aws.provisionerRoleName | quote }}
            - name: AWS_PERMISSIONS_BOUNDARY_POLICY_NAME
              value: {{ .Values.providers.aws.permissionsBoundaryPolicyName | quote }}
            {{- end }}
            {{- if .Values.runtime.enabled }}
            - name: RUNTIME_IMAGE
              value: {{ required "runtime.image is required" .Values.runtime.image | quote }}
            - name: RUNTIME_CONFIG_MAP_NAME
              value: agent-registry-runtime
            - name: RUNTIME_CONFIG_DIRECTORY
              value: /etc/agent-registry-runtime
            - name: RUNTIME_NODE_ARCHITECTURE
              value: {{ .Values.runtime.nodeArchitecture | quote }}
            - name: RUNTIME_WORKSPACE_STORAGE_CLASS
              value: {{ required "runtime.workspaceStorageClass is required" .Values.runtime.workspaceStorageClass | quote }}
            - name: RUNTIME_ENG_PORTAL_PROFILES_URL
              value: {{ .Values.runtime.engPortalProfilesURL | quote }}
            - name: RUNTIME_OTEL_HEADERS_SECRET_NAME
              value: {{ .Values.runtime.otelHeadersSecretName | quote }}
            - name: RUNTIME_ANTHROPIC_TOKEN_AUDIENCE
              value: {{ .Values.runtime.anthropicAudience | quote }}
            - name: ANTHROPIC_ORGANIZATION_ID
              value: {{ required "runtime.anthropicOrganizationID is required" .Values.runtime.anthropicOrganizationID | quote }}
            - name: RUNTIME_TAILSCALE_TOKEN_AUDIENCE
              {{- if .Values.runtime.tailscaleAudience }}
              value: {{ .Values.runtime.tailscaleAudience | quote }}
              {{- else }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.runtime.tailscaleIdentityConfigMap }}
                  key: tailscale_audience
              {{- end }}
            - name: RUNTIME_TAILSCALE_CLIENT_ID
              {{- if .Values.runtime.tailscaleClientID }}
              value: {{ .Values.runtime.tailscaleClientID | quote }}
              {{- else }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.runtime.tailscaleIdentityConfigMap }}
                  key: tailscale_client_id
              {{- end }}
            - name: RUNTIME_TAILSCALE_TAG
              value: {{ .Values.runtime.tailscaleTag | quote }}
            {{- end }}
          {{- if .Values.runtime.enabled }}
          volumeMounts:
            - name: runtime-config-source
              mountPath: /etc/agent-registry-runtime
              readOnly: true
          {{- end }}
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      {{- if .Values.runtime.enabled }}
      volumes:
        - name: runtime-config-source
          configMap:
            name: agent-registry-runtime-source
      {{- end }}
      securityContext:
        runAsNonRoot: true
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
