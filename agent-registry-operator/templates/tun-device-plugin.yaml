{{- if and .Values.agent.runtime.enabled .Values.providers.tailscale.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: tun-device-plugin
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: device-plugin
    app.kubernetes.io/name: tun-device-plugin
    app.kubernetes.io/part-of: agent-registry
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tun-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/component: device-plugin
        app.kubernetes.io/name: tun-device-plugin
        app.kubernetes.io/part-of: agent-registry
    spec:
      priorityClassName: system-node-critical
      nodeSelector:
        kubernetes.io/arch: {{ .Values.agent.runtime.nodeArchitecture }}
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: device-plugin
          image: {{ printf "%s:%s" .Values.tunDevicePlugin.image.repository .Values.tunDevicePlugin.image.tag | quote }}
          imagePullPolicy: {{ .Values.tunDevicePlugin.image.pullPolicy }}
          args:
            - --domain
            - agents.czi.team
            - --device
            - |
              name: tun
              groups:
                - count: {{ .Values.tunDevicePlugin.deviceCount }}
                  paths:
                    - path: /dev/net/tun
          resources:
            {{- toYaml .Values.tunDevicePlugin.resources | nindent 12 }}
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: dev
          hostPath:
            path: /dev
{{- end }}
