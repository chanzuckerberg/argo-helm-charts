{{- if .Values.api.enabled }}
# The API Role can write every Secret in this namespace, because RBAC cannot
# scope Secrets by name. This limits the API's writes here to its GitHub
# credential Secrets. Copied from config/admission/api-secret-policy.yaml in
# chanzuckerberg/agent-registry, under its own name so it doesn't collide with
# the cluster-wide copy the staging app installs on dev-central.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-registry-fleet-api-secret-writes
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["secrets"]
  matchConditions:
    - name: agent-registry-api
      expression: {{ printf "request.namespace == '%s' && request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace .Release.Namespace .Values.stack.services.api.serviceAccount.name | quote }}
  variables:
    - name: credentials
      expression: "['github', 'github-pending']"
  validations:
    # Opaque excludes ServiceAccount token Secrets.
    - expression: >-
        request.operation == 'DELETE' ||
        (object.type == 'Opaque' &&
        object.metadata.?labels[?'agents.czi.team/credential'].orValue('') in variables.credentials)
      message: agent-registry-api may write only Opaque GitHub credential Secrets
      reason: Forbidden
    # Checking the old object stops the API from relabeling another Secret.
    - expression: >-
        request.operation == 'CREATE' ||
        oldObject.metadata.?labels[?'agents.czi.team/credential'].orValue('') in variables.credentials
      message: agent-registry-api may change only GitHub credential Secrets
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-registry-fleet-api-secret-writes
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
spec:
  policyName: agent-registry-fleet-api-secret-writes
  validationActions: [Deny]
{{- end }}
