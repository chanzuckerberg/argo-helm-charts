{{- if .Values.api.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: agent-registry-fleet-api-owner-namespaces
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["namespaces"]
      - apiGroups: ["agents.czi.team"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["agentprofiles", "agents"]
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["rolebindings"]
  matchConditions:
    - name: agent-registry-api
      expression: {{ printf "request.userInfo.username == 'system:serviceaccount:%s:%s'" .Release.Namespace .Values.stack.services.api.serviceAccount.name | quote }}
  validations:
    - expression: >-
        request.resource.resource != 'namespaces' ||
        (object.metadata.name.matches('^argus-[a-z0-9]([-a-z0-9]*[a-z0-9])?-agent$') &&
        object.metadata.?labels[?'agents.czi.team/owner-namespace'].orValue('') in ['human', 'team'])
      message: agent-registry-api may create only labeled owner namespaces
      reason: Forbidden
    - expression: >-
        request.resource.resource == 'namespaces' ||
        request.namespace.matches('^argus-[a-z0-9]([-a-z0-9]*[a-z0-9])?-agent$')
      message: agent-registry-api may write Agent Registry resources only in owner namespaces
      reason: Forbidden
    - expression: >-
        request.resource.resource != 'rolebindings' ||
        (object.metadata.name == 'agent-registry-api-owner-secrets' &&
        object.roleRef.apiGroup == 'rbac.authorization.k8s.io' &&
        object.roleRef.kind == 'ClusterRole' &&
        object.roleRef.name == 'agent-registry-api-owner-secrets' &&
        size(object.subjects) == 1 &&
        object.subjects[0].kind == 'ServiceAccount' &&
        object.subjects[0].name == {{ .Values.stack.services.api.serviceAccount.name | quote }} &&
        object.subjects[0].namespace == {{ .Release.Namespace | quote }})
      message: agent-registry-api may create only its owner namespace credential RoleBinding
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: agent-registry-fleet-api-owner-namespaces
  labels:
    {{- include "agent-registry-operator.labels" . | nindent 4 }}
spec:
  policyName: agent-registry-fleet-api-owner-namespaces
  validationActions: [Deny]
{{- end }}
