suite: test nodepool template
templates:
  - templates/nodepool.yaml
tests:
  - it: should render a single NodePool from legacy nodepool values when nodepools is empty
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        equal:
          path: metadata.name
          value: gpu-workloads
      - documentIndex: 0
        equal:
          path: spec.disruption.consolidationPolicy
          value: WhenEmptyOrUnderutilized
      - documentIndex: 0
        equal:
          path: spec.disruption.consolidateAfter
          value: 30s
      - documentIndex: 0
        equal:
          path: spec.template.spec.nodeClassRef.name
          value: default

  - it: should render multiple NodePools when nodepools dict is set
    set:
      nodepools:
        gpu-reserved:
          disruption:
            consolidateAfter: Never
          template:
            spec:
              requirements:
                - key: karpenter.sh/capacity-type
                  operator: In
                  values:
                    - reserved
        gpu-ondemand:
          disruption:
            consolidateAfter: 15m
          template:
            spec:
              requirements:
                - key: karpenter.sh/capacity-type
                  operator: In
                  values:
                    - on-demand
    asserts:
      - hasDocuments:
          count: 2
      - documentIndex: 0
        equal:
          path: spec.disruption.consolidateAfter
          value: 15m
      - documentIndex: 1
        equal:
          path: spec.disruption.consolidateAfter
          value: Never

  - it: should use dict key as NodePool name
    set:
      nodepools:
        my-custom-pool: {}
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        equal:
          path: metadata.name
          value: my-custom-pool

  - it: should inherit defaults into nodepools entries
    set:
      nodepool:
        name: base-pool
        template:
          spec:
            nodeClassRef:
              name: my-nodeclass
      nodepools:
        pool-override: {}
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        equal:
          path: metadata.name
          value: pool-override
      # nodeClassRef inherited from nodepool defaults
      - documentIndex: 0
        equal:
          path: spec.template.spec.nodeClassRef.name
          value: my-nodeclass

  - it: should not render disabled pools
    set:
      nodepools:
        enabled-pool:
          enabled: true
        disabled-pool:
          enabled: false
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        equal:
          path: metadata.name
          value: enabled-pool
