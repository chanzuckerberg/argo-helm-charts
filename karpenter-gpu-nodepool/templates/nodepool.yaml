{{/*
  Render one or more NodePool resources. When the `nodepools` dict is set,
  each key becomes a NodePool name and its value is merged with the `nodepool`
  defaults. When `nodepools` is empty (backward compat), a single NodePool is
  rendered using the `nodepool` values directly, keyed by nodepool.name.
*/}}
{{- $defaults := .Values.nodepool -}}
{{- $pools := dict -}}
{{- if .Values.nodepools -}}
  {{- $pools = .Values.nodepools -}}
{{- else -}}
  {{- $pools = dict $defaults.name $defaults -}}
{{- end -}}
{{- range $name, $pool := $pools }}
{{- $merged := mergeOverwrite (deepCopy $defaults) $pool -}}
{{- if $merged.enabled }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ $name }}
  labels:
    {{- include "karpenter-gpu-nodepool.labels" $ | nindent 4 }}
spec:
  disruption:
    consolidationPolicy: {{ $merged.disruption.consolidationPolicy }}
    consolidateAfter: {{ $merged.disruption.consolidateAfter }}
  {{- with $merged.limits }}
  limits:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- toYaml $merged.template.metadata.labels | nindent 8 }}
    spec:
      expireAfter: {{ $merged.template.spec.expireAfter }}
      nodeClassRef:
        group: {{ $merged.template.spec.nodeClassRef.group }}
        kind: {{ $merged.template.spec.nodeClassRef.kind }}
        name: {{ $merged.template.spec.nodeClassRef.name }}
      {{- with $merged.template.spec.startupTaints }}
      startupTaints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      requirements:
        {{- toYaml $merged.template.spec.requirements | nindent 8 }}
      {{- with $merged.template.spec.taints }}
      taints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
