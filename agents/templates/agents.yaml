{{- if .Values.enabled }}
{{- range $name, $agent := .Values.agents }}
{{- $profile := required (printf "agents.%s.profile is required" $name) $agent.profile }}
{{- $spec := dict "profileRef" (dict "name" $profile) }}
{{- range $field := list "harness" "model" "suspended" "timeout" "purpose" "schedule" }}
{{- if hasKey $agent $field }}
{{- $_ := set $spec $field (get $agent $field) }}
{{- end }}
{{- end }}
{{- if $agent.image }}
{{- $_ := set $spec "image" (required (printf "agents.%s.image.repository is required" $name) $agent.image.repository) }}
{{- if hasKey $agent.image "tag" }}
{{- $_ := set $spec "imageTag" $agent.image.tag }}
{{- end }}
{{- end }}
{{- $runtime := dict }}
{{- if $agent.command }}
{{- $_ := set $runtime "command" $agent.command }}
{{- end }}
{{- if $agent.resources }}
{{- $_ := set $runtime "resources" $agent.resources }}
{{- end }}
{{- $environment := include "agents.environment" (dict "root" $ "agent" $agent) | fromYamlArray }}
{{- if $environment }}
{{- $_ := set $runtime "env" $environment }}
{{- end }}
{{- $environmentFrom := include "agents.environmentFrom" (dict "root" $ "agent" $agent) | fromYamlArray }}
{{- if $environmentFrom }}
{{- $_ := set $runtime "envFrom" $environmentFrom }}
{{- end }}
{{- if $runtime }}
{{- $_ := set $spec "runtime" $runtime }}
{{- end }}
---
apiVersion: agents.czi.team/v1alpha1
kind: Agent
metadata:
  name: {{ $name }}
  labels:
    {{- include "agents.labels" $ | nindent 4 }}
spec:
  {{- toYaml $spec | nindent 2 }}
{{- end }}
{{- end }}
