# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test AgentProfiles
templates:
  - agentprofiles.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a reviewed profile and AWS source role
    set:
      enabled: true
      global:
        argusMetadata:
          stackName: gitops-stack
      profiles:
        batch-profile:
          owner:
            issuer: https://czi.okta.com
            subject: 00u-example
            email: owner@example.com
          grants:
            - aws:
                accountId: "111111111111"
                roleArn: arn:aws:iam::111111111111:role/source-role
          runtimeDefaults:
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
    asserts:
      - isKind:
          of: AgentProfile
      - equal:
          path: metadata.name
          value: batch-profile
      - equal:
          path: metadata.labels["agents.czi.team/stack"]
          value: gitops-stack
      - equal:
          path: spec.grants[0].aws.roleArn
          value: arn:aws:iam::111111111111:role/source-role
      - equal:
          path: spec.runtimeDefaults.resources.requests.memory
          value: 2Gi
