# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test Agents
templates:
  - agents.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a continuous custom Agent with Argus configuration
    set:
      global:
        env:
          - name: SHARED_VALUE
            value: global
          - name: GLOBAL_ONLY
            value: inherited
        appSecrets:
          clusterSecret:
            secretName: cluster-secret
          clusterCLISecret:
            secretName: cluster-cli-secret
          envSecret:
            secretName: environment-secret
          stackSecret:
            secretName: stack-secret
        appContext:
          envContextConfigMapName: environment-context
          stackContextConfigMapName: stack-context
        argusMetadata:
          stackName: gitops-stack
      agents:
        batch-worker:
          profile: batch-profile
          harness: custom-agent-code
          image:
            repository: example.com/agents/batch-worker
            tag: sha-123
          command:
            - /app/worker
          timeout: 8h
          env:
            - name: SHARED_VALUE
              value: agent
            - name: AGENT_ONLY
              value: configured
          envFrom:
            - secretRef:
                name: explicit-secret
    asserts:
      - isKind:
          of: Agent
      - equal:
          path: metadata.name
          value: batch-worker
      - equal:
          path: metadata.labels["agents.czi.team/stack"]
          value: gitops-stack
      - equal:
          path: spec.profileRef.name
          value: batch-profile
      - equal:
          path: spec.image
          value: example.com/agents/batch-worker
      - equal:
          path: spec.imageTag
          value: sha-123
      - equal:
          path: spec.runtime.command
          value:
            - /app/worker
      - equal:
          path: spec.runtime.env
          value:
            - name: SHARED_VALUE
              value: agent
            - name: GLOBAL_ONLY
              value: inherited
            - name: AGENT_ONLY
              value: configured
      - equal:
          path: spec.runtime.envFrom
          value:
            - secretRef:
                name: cluster-secret
                optional: true
            - secretRef:
                name: cluster-cli-secret
                optional: true
            - secretRef:
                name: environment-secret
                optional: true
            - secretRef:
                name: stack-secret
                optional: true
            - configMapRef:
                name: environment-context
                optional: true
            - configMapRef:
                name: stack-context
                optional: true
            - secretRef:
                name: explicit-secret

  - it: renders a scheduled custom Agent
    set:
      agents:
        scheduled-worker:
          profile: batch-profile
          harness: custom-agent-code
          image:
            repository: example.com/agents/scheduled-worker
          timeout: indefinite
          schedule: "0 9 * * 1-5"
          suspended: true
    asserts:
      - equal:
          path: spec.schedule
          value: "0 9 * * 1-5"
      - equal:
          path: spec.timeout
          value: indefinite
      - equal:
          path: spec.suspended
          value: true
