apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.readerServiceAccountName }}
  namespace: {{ .Values.serviceAccountRef.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-platform-ecr-reader
  namespace: {{ .Values.serviceAccountRef.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-platform-ecr-reader
  namespace: {{ .Values.serviceAccountRef.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.readerServiceAccountName }}
    namespace: {{ .Values.serviceAccountRef.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-platform-ecr-reader
