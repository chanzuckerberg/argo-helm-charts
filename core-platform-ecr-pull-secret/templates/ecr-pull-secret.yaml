apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: core-platform-ecr-source
  namespace: {{ .Values.serviceAccountRef.namespace }}
spec:
  region: {{ .Values.aws.region }}
  scope: private
  auth:
    jwt:
      serviceAccountRef:
        name: {{ .Values.serviceAccountRef.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: core-platform-ecr-source
  namespace: {{ .Values.serviceAccountRef.namespace }}
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  target:
    name: core-platform-ecr-source
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      metadata:
        annotations:
          expiresAt: "{{ `{{ .expires_at }}` }}"
      data:
        .dockerconfigjson: |
          {
            "auths": {
              "{{ .Values.registry }}": {
                "username": "{{ `{{ .username }}` }}",
                "password": "{{ `{{ .password }}` }}",
                "auth": "{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"
              }
            }
          }
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: core-platform-ecr-source
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.readerServiceAccountName }}
  namespace: {{ .Values.serviceAccountRef.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: core-platform-ecr-reader
  namespace: {{ .Values.serviceAccountRef.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: core-platform-ecr-reader
  namespace: {{ .Values.serviceAccountRef.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.readerServiceAccountName }}
    namespace: {{ .Values.serviceAccountRef.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: core-platform-ecr-reader
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: core-platform-ecr-source
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.serviceAccountRef.namespace }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: {{ .Values.serviceAccountRef.namespace }}
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Values.readerServiceAccountName }}
          namespace: {{ .Values.serviceAccountRef.namespace }}
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: core-platform-ecr
spec:
  externalSecretName: core-platform-ecr
  namespaceSelectors:
    - matchLabels: {}
  externalSecretSpec:
    refreshInterval: {{ .Values.replicationRefreshInterval }}
    secretStoreRef:
      name: core-platform-ecr-source
      kind: ClusterSecretStore
    target:
      name: core-platform-ecr
      creationPolicy: Owner
      template:
        type: kubernetes.io/dockerconfigjson
    data:
      - secretKey: .dockerconfigjson
        remoteRef:
          key: core-platform-ecr-source
          property: .dockerconfigjson
