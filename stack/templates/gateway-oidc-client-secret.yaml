{{- $root := . -}}
{{- range $name, $def := fromYaml (include "securityPolicy.definitions" .) -}}
{{- $from := (($def.oidc).clientSecretFrom) | default dict -}}
{{- if and (gt (len $from) 0) (not $from.property) -}}
{{- fail (printf "securityPolicies.%s.oidc.clientSecretFrom is set but names no property. Name the property in the remote secret that holds the client secret, or remove the block." $name) -}}
{{- end -}}
{{- if $from.property -}}
{{- if ($def.oidc).clientSecretName -}}
{{- fail (printf "securityPolicies.%s.oidc sets both clientSecretName and clientSecretFrom. clientSecretName points at a Secret you manage; clientSecretFrom asks the chart to project one. Pick one." $name) -}}
{{- end -}}
{{- $remoteKey := include "securityPolicy.clientSecretFromRemoteKey" (dict "from" $from "root" $root "name" $name) -}}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "securityPolicy.projectedSecretName" (dict "release" $root.Release.Name "name" $name) }}
  labels:
    {{- include "stack.labels" $root | nindent 4 }}
  {{- with $from.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  refreshInterval: {{ $from.refreshInterval | default "1m" | quote }}
  secretStoreRef:
    name: {{ ($from.secretStoreRef).name | default "aws-secretsmanager" }}
    kind: {{ ($from.secretStoreRef).kind | default "ClusterSecretStore" }}
  target:
    name: {{ include "securityPolicy.projectedSecretName" (dict "release" $root.Release.Name "name" $name) }}
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ $from.property | quote }}
    {{- if $from.clientIDProperty }}
    - secretKey: client-id
      remoteRef:
        key: {{ $remoteKey | quote }}
        property: {{ $from.clientIDProperty | quote }}
    {{- end }}
{{- end -}}
{{- end -}}
