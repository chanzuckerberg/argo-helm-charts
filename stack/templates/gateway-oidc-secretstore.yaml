{{- $needsStore := false -}}
{{- if .Values.global.gateway.oidcProtected -}}
  {{- $needsStore = true -}}
{{- end -}}
{{- range $svcName, $svcValues := .Values.services -}}
  {{- if dig "gateway" "oidcProtected" false $svcValues -}}
    {{- $needsStore = true -}}
  {{- end -}}
{{- end -}}
{{- if $needsStore -}}
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "stack.fullname" . }}-kubernetes-local
  labels:
    {{- include "stack.labels" . | nindent 4 }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Release.Namespace | quote }}
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: external-secrets-sa
          namespace: external-secrets
{{- end -}}
