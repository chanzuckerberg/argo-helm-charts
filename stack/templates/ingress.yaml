{{- $global := . -}}
{{ range $serviceName, $serviceValues := .Values.services }}
  {{- $globalValuesDict := $global.Values.global | toYaml -}}
  {{- $values := fromYaml $globalValuesDict -}}
  {{- $values = set $values "name" $serviceName -}}
  {{- $values := mergeOverwrite $values $serviceValues -}}

  {{/* Auto-disable ingress when gateway is explicitly enabled at service level */}}
  {{- if and (hasKey $serviceValues "gateway") (hasKey $serviceValues.gateway "enabled") $serviceValues.gateway.enabled -}}
    {{- if not (and (hasKey $serviceValues "ingress") (hasKey $serviceValues.ingress "enabled")) -}}
      {{- $_ := set $values "ingress" (mergeOverwrite (default dict $values.ingress) (dict "enabled" false)) -}}
    {{- end -}}
  {{- end -}}

  {{/* Auto-disable ingress when gateway config keys auto-enable the gateway (mirrors the gateway templates) */}}
  {{- if hasKey $serviceValues "gateway" -}}
    {{- $hasGatewayKeys := include "gateway.hasConfigKeys" (dict "Values" (dict "gateway" ($serviceValues.gateway | default dict))) -}}
    {{- if and $hasGatewayKeys (not (and (hasKey $serviceValues.gateway "enabled") (eq $serviceValues.gateway.enabled false))) -}}
      {{- $_ := set $values.gateway "enabled" true -}}
      {{- if not (or (and (hasKey $serviceValues "ingress") (hasKey $serviceValues.ingress "enabled") $serviceValues.ingress.enabled) (hasKey $serviceValues.gateway "dnsOwner")) -}}
        {{- $_ := set $values "ingress" (mergeOverwrite (default dict $values.ingress) (dict "enabled" false)) -}}
      {{- end -}}
    {{- end -}}
  {{- end -}}

  {{/* Auto-disable gateway when ingress is explicitly enabled at service level */}}
  {{- if and (hasKey $serviceValues "ingress") (hasKey $serviceValues.ingress "enabled") $serviceValues.ingress.enabled -}}
    {{- if not (and (hasKey $serviceValues "gateway") (or (hasKey $serviceValues.gateway "enabled") (hasKey $serviceValues.gateway "dnsOwner"))) -}}
      {{- $_ := set $values "gateway" (mergeOverwrite (default dict $values.gateway) (dict "enabled" false)) -}}
    {{- end -}}
  {{- end -}}

  {{- $service := dict "Chart" $global.Chart "Release" $global.Release "Capabilities" $global.Capabilities "Values" $values -}}
{{- with $service }}
{{- include "validate.gatewayIngressCoexistence" (dict "ctx" . "root" $global "name" .Values.name) -}}
{{- include "validate.protectedPathsNotGlobal" (dict "root" $global) -}}
{{- if and .Values.ingress.enabled (gt (len (.Values.gateway.protectedPaths | default list)) 0) (not .Values.ingress.oidcProtected) -}}
{{- fail (printf "service %s sets gateway.protectedPaths but renders an nginx Ingress with ingress.oidcProtected false, so those paths are served without authentication (protectedPaths applies only to the Envoy gateway). To keep the subtree protected on nginx, set ingress.oidcProtected: true and open the public paths with an oidcProxy.skipAuth inverse; or remove gateway.protectedPaths to accept those paths being public on the Ingress." .Values.name) -}}
{{- end -}}

{{- if .Values.ingress.enabled -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "service.fullname" .  }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
    {{- $certManagerAnnotations := (fromYaml (include "certManagerAnnotations" . )) }}
  annotations:
    {{- with (mergeOverwrite
                (dict)
                ($certManagerAnnotations)
                (.Values.annotations)
                (.Values.ingress.annotations)
                (fromYaml (include "ingress.coexistDnsAnnotations" . | default "{}"))
      ) }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ $service.Values.ingress.host }}
      http:
        paths:
          {{- range $service.Values.ingress.paths }} 
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                {{- include "service.backend" $service | nindent 16}}
          {{- end }}
    {{- $customHosts := list -}}
    {{- range $i, $rule := .Values.ingress.rules -}}
    {{- $ruleValues := mergeOverwrite (dict "host" $service.Values.ingress.host "paths" $service.Values.ingress.paths) $rule -}}
    {{ $customHosts = append $customHosts $ruleValues.host }}
    - host: {{ $ruleValues.host }}
      http:
        paths:
          {{- range $ruleValues.paths }} 
          - path: {{ .path }}
            {{- if .pathType }}
            pathType: {{ .pathType }}
            {{- end }}
            backend:
              service:
                {{- (include "service.backend" $service) | nindent 16 -}}
          {{ end -}}
    {{- end }}
  tls:
    - hosts:
      - {{ $service.Values.ingress.host  }}
    {{- range .Values.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ .  }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
   {{ if gt (len $customHosts) 0 }}
    - hosts:
      {{- toYaml $customHosts | nindent 6 }}
      {{- $secretName := printf "%s-%s-%s" "custom-hosts" (include "stack.fullname" .) "tls-secret" }}
      secretName: {{  regexReplaceAll "[^a-zA-Z0-9-]" $secretName "-" }}
    {{ end }}
{{ end }}
{{- end }}
{{- end }}
