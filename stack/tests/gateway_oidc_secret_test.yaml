# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test gateway OIDC per-service client secret (argus set secret override)
templates:
  - gateway-oidc-secret.yaml
tests:
  - it: renders no ExternalSecret when the app has no Argus secrets
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
          oidcProtected: true
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no ExternalSecret when clientSecretName is set explicitly
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
          oidcProtected: true
        oidcProxyGateway:
          clientSecretName: my-own-secret
        appSecrets:
          envSecret:
            secretName: argus-env
            secretKey: /argus/app=core-platform/env=prod
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no ExternalSecret when the service is not oidc protected
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
        appSecrets:
          envSecret:
            secretName: argus-env
            secretKey: /argus/app=core-platform/env=prod
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: builds a per-service ExternalSecret automatically when app secrets exist
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
          oidcProtected: true
        appSecrets:
          envSecret:
            secretName: argus-env
            secretKey: /argus/app=core-platform/env=prod
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        isKind:
          of: ExternalSecret

  - it: seeds from argus-global-oidc via templateFrom and overrides with env secret
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
          oidcProtected: true
        appSecrets:
          envSecret:
            secretName: argus-env
            secretKey: /argus/app=core-platform/env=prod
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        isKind:
          of: ExternalSecret
      - documentIndex: 0
        equal:
          path: metadata.name
          value: release-name-stack-service1-oidc-client-secret
      - documentIndex: 0
        equal:
          path: spec.target.name
          value: release-name-stack-service1-oidc-client-secret
      - documentIndex: 0
        equal:
          path: spec.target.template.templateFrom[0].secret.name
          value: argus-global-oidc
      - documentIndex: 0
        equal:
          path: spec.target.template.templateFrom[0].secret.items[0].key
          value: client-id
      - documentIndex: 0
        equal:
          path: spec.target.template.templateFrom[0].secret.items[1].key
          value: client-secret
      - documentIndex: 0
        exists:
          path: spec.target.template.templateFrom[1].literal
      - documentIndex: 0
        notExists:
          path: spec.target.template.data
      - documentIndex: 0
        equal:
          path: spec.dataFrom[0].extract.key
          value: /argus/app=core-platform/env=prod
      - documentIndex: 0
        notExists:
          path: spec.dataFrom[0].rewrite
      - documentIndex: 0
        lengthEqual:
          path: spec.dataFrom
          count: 1

  - it: layers cluster then env secrets so env wins
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
          oidcProtected: true
        appSecrets:
          clusterSecret:
            secretName: argus-cluster
            secretKey: /argus/cluster
          envSecret:
            secretName: argus-env
            secretKey: /argus/app=core-platform/env=prod
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        lengthEqual:
          path: spec.dataFrom
          count: 2
      - documentIndex: 0
        equal:
          path: spec.dataFrom[0].extract.key
          value: /argus/cluster
      - documentIndex: 0
        equal:
          path: spec.dataFrom[1].extract.key
          value: /argus/app=core-platform/env=prod
