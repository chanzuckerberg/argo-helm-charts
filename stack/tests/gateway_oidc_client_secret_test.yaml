# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test projected OIDC client secret
templates:
  - gateway-oidc-client-secret.yaml
tests:
  - it: projects the client secret under the key Envoy Gateway requires
    set:
      global:
        appSecrets:
          envSecret:
            secretKey: /example/app=demo/env=prod
        gateway:
          host: demo.example.test
        securityPolicies:
          custom-idp:
            oidc:
              clientSecretFrom:
                property: CLIENT_SECRET
              provider:
                issuer: https://idp.example.test
      services:
        api:
          gateway:
            enabled: true
            securityPolicy: custom-idp
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.name
          value: RELEASE-NAME-oidc-custom-idp
      - equal:
          path: spec.data[0].secretKey
          value: client-secret
      - equal:
          path: spec.data[0].remoteRef.property
          value: CLIENT_SECRET
      - equal:
          path: spec.data[0].remoteRef.key
          value: /example/app=demo/env=prod
      - lengthEqual:
          path: spec.data
          count: 1

  - it: also projects the client id when a property is named for it
    set:
      global:
        appSecrets:
          envSecret:
            secretKey: /example/app=demo/env=prod
        gateway:
          host: demo.example.test
        securityPolicies:
          custom-idp:
            oidc:
              clientSecretFrom:
                property: CLIENT_SECRET
                clientIDProperty: CLIENT_ID
              provider:
                issuer: https://idp.example.test
      services:
        api:
          gateway:
            enabled: true
            securityPolicy: custom-idp
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - lengthEqual:
          path: spec.data
          count: 2
      - equal:
          path: spec.data[1].secretKey
          value: client-id
      - equal:
          path: spec.data[1].remoteRef.property
          value: CLIENT_ID

  - it: reads an explicit remote secret when one is given
    set:
      global:
        appSecrets:
          envSecret:
            secretKey: /example/app=demo/env=prod
        gateway:
          host: demo.example.test
        securityPolicies:
          custom-idp:
            oidc:
              clientSecretFrom:
                property: CLIENT_SECRET
                remoteKey: /example/elsewhere
              provider:
                issuer: https://idp.example.test
      services:
        api:
          gateway:
            enabled: true
            securityPolicy: custom-idp
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - equal:
          path: spec.data[0].remoteRef.key
          value: /example/elsewhere

  - it: renders nothing when no policy asks for a projected secret
    set:
      global:
        gateway:
          host: demo.example.test
      services:
        api:
          gateway:
            enabled: true
            securityPolicy: oidc-protected-default
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 0

  - it: refuses both a managed secret name and a projected one
    set:
      global:
        appSecrets:
          envSecret:
            secretKey: /example/app=demo/env=prod
        gateway:
          host: demo.example.test
        securityPolicies:
          custom-idp:
            oidc:
              clientSecretName: my-own-secret
              clientSecretFrom:
                property: CLIENT_SECRET
              provider:
                issuer: https://idp.example.test
      services:
        api:
          gateway:
            enabled: true
            securityPolicy: custom-idp
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - failedTemplate:
          errorMessage: "securityPolicies.custom-idp.oidc sets both clientSecretName and clientSecretFrom. clientSecretName points at a Secret you manage; clientSecretFrom asks the chart to project one. Pick one."

  - it: refuses a projection that names no property
    set:
      global:
        appSecrets:
          envSecret:
            secretKey: /example/app=demo/env=prod
        gateway:
          host: demo.example.test
        securityPolicies:
          custom-idp:
            oidc:
              clientSecretFrom:
                refreshInterval: 5m
              provider:
                issuer: https://idp.example.test
      services:
        api:
          gateway:
            enabled: true
            securityPolicy: custom-idp
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - failedTemplate:
          errorMessage: "securityPolicies.custom-idp.oidc.clientSecretFrom is set but names no property. Name the property in the remote secret that holds the client secret, or remove the block."

  - it: refuses a projection when no remote secret can be resolved
    set:
      global:
        gateway:
          host: demo.example.test
        securityPolicies:
          custom-idp:
            oidc:
              clientSecretFrom:
                property: CLIENT_SECRET
              provider:
                issuer: https://idp.example.test
      services:
        api:
          gateway:
            enabled: true
            securityPolicy: custom-idp
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - failedTemplate:
          errorMessage: "securityPolicies.custom-idp.oidc.clientSecretFrom is set but no remote secret could be resolved. The chart falls back to global.appSecrets.envSecret.secretKey, which is empty here, so set clientSecretFrom.remoteKey explicitly."
