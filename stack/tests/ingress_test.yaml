# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test ingress
templates:
  - ingress.yaml
tests:
  - it: fails when protectedPaths is set at the global level
    set:
      global:
        ingress:
          host: "stack.play.dev.czi.team"
          oidcProtected: false
        gateway:
          protectedPaths:
            - path: /admin
      services:
        service1:
          ingress:
            paths:
              - path: "/"
                pathType: Prefix
    asserts:
      - failedTemplate:
          errorPattern: must be set per service
  - it: adds nginx auth annotations when oidcProxy.enabled=true
    set:
      global:
        ingress:
          host: "stack.play.dev.czi.team"
        oidcProxy:
          enabled: true
      services:
        service1:
          ingress:
            oidcProtected: true
    asserts:
      - isKind:
          of: Ingress
  - it: adds additional nginx auth headers when using additionalHeaders
    set:
      global:
        ingress:
          host: "stack.play.dev.czi.team"
        oidcProxy:
          enabled: true
          additionalHeaders:
            - X-Forwarded-User
            - blahblahblah
      services:
        service1:
          ingress:
            oidcProtected: true
    asserts:
      - isKind:
          of: Ingress
  - it: adds auth-snippet with using skipAuth
    set:
      global:
        ingress:
          host: "stack.play.dev.czi.team"
        oidcProxy:
          enabled: true
          skipAuth:
            - path: /healthz
              method: GET
            - path: /api/*
              method: "*"
      services:
        service1:
          ingress:
            oidcProtected: true
    asserts:
      - isKind:
          of: Ingress
  - it: adds adds certManager annotations
    set:
      global:
        fullnameOverride: missing-otter
        ingress:
          host: stack.play.dev.czi.team
        oidcProxy:
          enabled: true
          skipAuth:
            - path: /healthz
              method: GET
            - path: /api/*
              method: "*"
      services:
        service1:
          ingress:
            oidcProtected: true
            rules:
              - host: cellxgene.cziscience.com
              - host: api.cellxgene.cziscience.com
        unprotected-service:
          ingress:
            oidcProtected: false
    asserts:
      - isKind:
          of: Ingress
      - documentIndex: 0
        equal:
          path: metadata.annotations["cert-manager.io/cluster-issuer"]
          value: letsencrypt-prod
      - documentIndex: 0
        equal:
          path: metadata.annotations["cert-manager.io/private-key-algorithm"]
          value: RSA
      - documentIndex: 0
        equal:
          path: metadata.annotations["cert-manager.io/private-key-size"]
          value: "4096"
      - documentIndex: 0
        equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/exclude"]
          value: "false"
      - documentIndex: 0
        equal:
          path: metadata.annotations["external-dns.alpha.kubernetes.io/target"]
          value: "access.play.dev.czi.team"
      - documentIndex: 0
        contains:
          path: spec.tls[0].hosts
          content: stack.play.dev.czi.team
      - documentIndex: 0
        notContains:
          path: spec.tls[0].hosts
          content: api.cellxgene.cziscience.com
      - documentIndex: 0
        notContains:
          path: spec.tls[0].hosts
          content: cellxgene.cziscience.com
      - documentIndex: 0
        notExists:
          path: spec.tls[0].secretName
      - documentIndex: 0
        notContains:
          path: spec.tls[1].hosts
          content: stack.play.dev.czi.team
      - documentIndex: 0
        contains:
          path: spec.tls[1].hosts
          content: api.cellxgene.cziscience.com
      - documentIndex: 0
        contains:
          path: spec.tls[1].hosts
          content: cellxgene.cziscience.com
      - documentIndex: 0
        equal:
          path: spec.tls[1].secretName
          value: custom-hosts-missing-otter-tls-secret
      - documentIndex: 0
        lengthEqual:
          path: spec.tls[0].hosts
          count: 1
      - documentIndex: 0
        lengthEqual:
          path: spec.tls[1].hosts
          count: 2
      - documentIndex: 0
        equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: missing-otter-oidc-proxy
      - documentIndex: 0
        equal:
          path: spec.rules[1].http.paths[0].backend.service.name
          value: missing-otter-oidc-proxy
      - documentIndex: 0
        equal:
          path: spec.rules[2].http.paths[0].backend.service.name
          value: missing-otter-oidc-proxy
      - documentIndex: 1
        equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: missing-otter-unprotected-service

  - it: should include argus/env-name label when argusMetadata.envName is set
    set:
      global:
        argusMetadata:
          envName: "production"
        ingress:
          host: "test.example.com"
      services:
        service1:
          ingress:
            enabled: true
    asserts:
      - equal:
          path: metadata.labels["argus/env-name"]
          value: "production"
  - it: renders a public ingress-only sibling when another service declares protectedPaths per service
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: app.example.com
          securityPolicy: oidc-protected-default
          paths:
            - path: /
      services:
        app:
          gateway:
            protectedPaths:
              - path: /admin
        docs:
          ingress:
            enabled: true
            host: docs.example.com
    asserts:
      - isKind:
          of: Ingress
  - it: fails when the service itself sets protectedPaths but renders an unprotected nginx Ingress
    set:
      global:
        ingress:
          host: app.example.com
      services:
        app:
          ingress:
            enabled: true
          gateway:
            securityPolicy: oidc-protected-default
            protectedPaths:
              - path: /admin
    asserts:
      - failedTemplate:
          errorPattern: served without authentication
  - it: allows an oidcProtected Ingress whose skipAuth does not touch the protected prefix
    set:
      global:
        ingress:
          host: app.example.com
          oidcProtected: true
        oidcProxy:
          enabled: true
          skipAuth:
            - path: /public
      services:
        app:
          ingress:
            enabled: true
            oidcProtected: true
          gateway:
            protectedPaths:
              - path: /admin
    asserts:
      - isKind:
          of: Ingress
