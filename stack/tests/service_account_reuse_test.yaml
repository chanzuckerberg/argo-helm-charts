# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test what reusing an existing service account does to the pod
templates:
  - deployment.yaml
  - serviceaccount.yaml
tests:
  - it: a service takes its own account by default, not the namespace default
    set:
      services:
        api: {}
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: release-name-stack-api
      - template: serviceaccount.yaml
        hasDocuments:
          count: 1

  - it: reusing the namespace default account stops the chart creating one
    set:
      services:
        api:
          serviceAccount:
            create: false
            name: default
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0

  - it: registry credentials ride on the account, so reusing one drops them
    set:
      services:
        api:
          serviceAccount:
            create: false
            name: default
    asserts:
      - template: deployment.yaml
        notExists:
          path: spec.template.spec.imagePullSecrets

  - it: pod-level imagePullSecrets restore them when no account is created
    set:
      services:
        api:
          serviceAccount:
            create: false
            name: default
          imagePullSecrets:
            - name: core-platform-ecr
            - name: dhi-oci-registry
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: default
      - template: deployment.yaml
        equal:
          path: spec.template.spec.imagePullSecrets
          value:
            - name: core-platform-ecr
            - name: dhi-oci-registry

  - it: serviceAccount.imagePullSecrets does nothing once the account is not created
    set:
      services:
        api:
          serviceAccount:
            create: false
            name: default
            imagePullSecrets:
              - name: core-platform-ecr
    asserts:
      - template: serviceaccount.yaml
        hasDocuments:
          count: 0
      - template: deployment.yaml
        notExists:
          path: spec.template.spec.imagePullSecrets

  - it: a named account the chart does create still carries its credentials
    set:
      services:
        api:
          serviceAccount:
            create: true
            name: shared-writer
    asserts:
      - template: deployment.yaml
        equal:
          path: spec.template.spec.serviceAccountName
          value: shared-writer
      - template: serviceaccount.yaml
        equal:
          path: metadata.name
          value: shared-writer
      - template: serviceaccount.yaml
        exists:
          path: imagePullSecrets
