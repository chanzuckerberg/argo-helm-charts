# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test gateway SecurityPolicy (oidc, basicAuth, cors, ipAllowList)
templates:
- gateway-securitypolicy.yaml
- gateway-securitypolicy-shared.yaml
tests:
- it: should create no SecurityPolicy when no security features are set
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 0
- it: should create a SecurityPolicy named -oidc for the primary host
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 1
  - documentIndex: 0
    isKind:
      of: SecurityPolicy
  - documentIndex: 0
    equal:
      path: metadata.name
      value: release-name-stack-oidc-protected-default
  - documentIndex: 0
    equal:
      path: spec.targetRefs[0].name
      value: release-name-stack-service1
  - documentIndex: 0
    equal:
      path: spec.oidc.redirectURL
      value: https://api.example.com/oauth2/callback
  - documentIndex: 0
    equal:
      path: spec.oidc.clientID
      value: my-client-id
  - documentIndex: 0
    equal:
      path: spec.oidc.clientSecret.name
      value: argus-global-oidc
  template: gateway-securitypolicy-shared.yaml
- it: should namespace redirectURL and logoutPath under the derived base path
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
        paths:
        - path: /portal
          pathType: Prefix
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.redirectURL
      value: https://api.example.com/portal/oauth2/callback
  - documentIndex: 0
    equal:
      path: spec.oidc.logoutPath
      value: /portal/logout
  template: gateway-securitypolicy-shared.yaml
- it: should namespace redirectURL and logoutPath under the first non-root Prefix path when multiple paths are configured
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
        paths:
        - path: /portal
          pathType: Prefix
        - path: /admin
          pathType: Prefix
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.redirectURL
      value: https://api.example.com/portal/oauth2/callback
  - documentIndex: 0
    equal:
      path: spec.oidc.logoutPath
      value: /portal/logout
  template: gateway-securitypolicy-shared.yaml
- it: should point both clientIDRef and clientSecret at the global secret by default
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.clientIDRef.name
      value: argus-global-oidc
  - documentIndex: 0
    equal:
      path: spec.oidc.clientSecret.name
      value: argus-global-oidc
  - documentIndex: 0
    notExists:
      path: spec.oidc.clientID
  template: gateway-securitypolicy-shared.yaml
- it: should ignore Argus app secrets when choosing the credential secret
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      appSecrets:
        envSecret:
          secretName: argus-env
          secretKey: /argus/app=core-platform/env=prod
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.clientSecret.name
      value: argus-global-oidc
  template: gateway-securitypolicy-shared.yaml
- it: should honor a custom globalSecretName
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            globalSecretName: my-global-oidc
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.clientSecret.name
      value: my-global-oidc
  template: gateway-securitypolicy-shared.yaml
- it: should reference an explicit clientSecretName over the global secret
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      appSecrets:
        envSecret:
          secretName: argus-env
          secretKey: /argus/app=core-platform/env=prod
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientSecretName: my-own-secret
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.clientSecret.name
      value: my-own-secret
  - documentIndex: 0
    equal:
      path: spec.oidc.clientIDRef.name
      value: my-own-secret
  template: gateway-securitypolicy-shared.yaml
- it: should realize a grouped SecurityPolicy for each rules host with full OIDC config
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
        rules:
        - host: api2.example.com
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
              authorizationEndpoint: https://auth.example.com/authorize
              tokenEndpoint: https://auth.example.com/token
            logoutPath: /logout
            forwardAccessToken: true
            cookieDomain: example.com
            scopes:
            - openid
            - profile
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 2
  - documentIndex: 1
    matchRegex:
      path: metadata.name
      pattern: ^release-name-stack-oidc-protected-default-[0-9a-f]{8}$
  - documentIndex: 1
    equal:
      path: spec.oidc.provider.issuer
      value: https://auth.example.com
  - documentIndex: 1
    equal:
      path: spec.oidc.provider.authorizationEndpoint
      value: https://auth.example.com/authorize
  - documentIndex: 1
    equal:
      path: spec.oidc.clientID
      value: my-client-id
  - documentIndex: 1
    equal:
      path: spec.oidc.logoutPath
      value: /logout
  - documentIndex: 1
    equal:
      path: spec.oidc.cookieDomain
      value: example.com
  - documentIndex: 1
    contains:
      path: spec.oidc.scopes
      content: openid
  - documentIndex: 1
    matchRegex:
      path: metadata.name
      pattern: ^release-name-stack-oidc-protected-default-[0-9a-f]{8}$
  - documentIndex: 1
    equal:
      path: spec.oidc.redirectURL
      value: https://api2.example.com/oauth2/callback
  template: gateway-securitypolicy-shared.yaml
- it: should include annotations on SecurityPolicies
  set:
    global:
      ingress:
        enabled: false
      annotations:
        global-annotation: global-value
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
          annotations:
            oidc-annotation: oidc-value
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: metadata.annotations["global-annotation"]
      value: global-value
  - documentIndex: 0
    equal:
      path: metadata.annotations["oidc-annotation"]
      value: oidc-value
  template: gateway-securitypolicy-shared.yaml
- it: should render basicAuth (named -security) when enabled without oidc
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: custom
      securityPolicies:
        custom:
          basicAuth:
            enabled: true
            secretName: my-htpasswd
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 1
  - documentIndex: 0
    equal:
      path: metadata.name
      value: release-name-stack-custom
  - documentIndex: 0
    equal:
      path: spec.basicAuth.users.name
      value: my-htpasswd
  - documentIndex: 0
    notExists:
      path: spec.oidc
  template: gateway-securitypolicy-shared.yaml
- it: should render cors when enabled
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: custom
      securityPolicies:
        custom:
          cors:
            enabled: true
            allowOrigins:
            - https://app.example.com
            allowMethods:
            - GET
            - POST
            allowCredentials: true
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 1
  - documentIndex: 0
    contains:
      path: spec.cors.allowOrigins
      content: https://app.example.com
  - documentIndex: 0
    equal:
      path: spec.cors.allowCredentials
      value: true
  template: gateway-securitypolicy-shared.yaml
- it: should render an IP allowlist authorization rule
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: custom
      securityPolicies:
        custom:
          ipAllowList:
          - 192.112.170.192/26
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 1
  - documentIndex: 0
    equal:
      path: spec.authorization.defaultAction
      value: Deny
  - documentIndex: 0
    equal:
      path: spec.authorization.rules[0].action
      value: Allow
  - documentIndex: 0
    contains:
      path: spec.authorization.rules[0].principal.clientCIDRs
      content: 192.112.170.192/26
  template: gateway-securitypolicy-shared.yaml
- it: should compose oidc with cors in a single SecurityPolicy
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
          cors:
            enabled: true
            allowOrigins:
            - https://app.example.com
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 1
  - documentIndex: 0
    exists:
      path: spec.oidc
  - documentIndex: 0
    exists:
      path: spec.cors
  template: gateway-securitypolicy-shared.yaml
- it: should add a public SecurityPolicy for cors on the skipAuth route
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
            skipAuth:
            - path: /healthz
              method: GET
          cors:
            enabled: true
            allowOrigins:
            - https://app.example.com
    services:
      service1: {}
  asserts:
  - hasDocuments:
      count: 1
  - documentIndex: 0
    equal:
      path: metadata.name
      value: release-name-stack-service1-public-security
  - documentIndex: 0
    notExists:
      path: spec.oidc
  - documentIndex: 0
    exists:
      path: spec.cors
  template: gateway-securitypolicy.yaml
- it: should render denyRedirect by default and deterministic cookie names
  release:
    name: release-name
    namespace: argus-karpenter-lens-rdev
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
    services:
      app: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[0].name
      value: Sec-Fetch-Mode
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[0].type
      value: RegularExpression
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[0].value
      value: cors|no-cors|same-origin
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[2].name
      value: X-Requested-With
  - documentIndex: 0
    equal:
      path: spec.oidc.cookieNames.accessToken
      value: AccessToken-oidc-protected-default-api-example-com
  - documentIndex: 0
    equal:
      path: spec.oidc.cookieNames.idToken
      value: IdToken-oidc-protected-default-api-example-com
  - documentIndex: 0
    notExists:
      path: spec.oidc.csrfTokenTTL
  template: gateway-securitypolicy-shared.yaml
- it: should omit denyRedirect when disabled and let cookieNames overrides win
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
            denyRedirect:
              enabled: false
            csrfTokenTTL: 5m
            cookieNames:
              accessToken: MyAccess
              idToken: MyId
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    notExists:
      path: spec.oidc.denyRedirect
  - documentIndex: 0
    equal:
      path: spec.oidc.csrfTokenTTL
      value: 5m
  - documentIndex: 0
    equal:
      path: spec.oidc.cookieNames.accessToken
      value: MyAccess
  - documentIndex: 0
    equal:
      path: spec.oidc.cookieNames.idToken
      value: MyId
  template: gateway-securitypolicy-shared.yaml
- it: should render apiRoutes as :path matchers after the default denyRedirect headers
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
            apiRoutes:
            - path: /api
            - path: /graphql(\?.*)?$
              matchType: RegularExpression
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[0].name
      value: Sec-Fetch-Mode
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[3].name
      value: :path
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[3].type
      value: Prefix
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[3].value
      value: /api
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[4].type
      value: RegularExpression
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[4].value
      value: /graphql(\?.*)?$
  template: gateway-securitypolicy-shared.yaml
- it: should render only :path matchers when denyRedirect is disabled but apiRoutes are set
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
            denyRedirect:
              enabled: false
            apiRoutes:
            - path: /api
    services:
      service1: {}
  asserts:
  - documentIndex: 0
    equal:
      path: spec.oidc.denyRedirect.headers[0].name
      value: :path
  - documentIndex: 0
    lengthEqual:
      path: spec.oidc.denyRedirect.headers
      count: 1
  template: gateway-securitypolicy-shared.yaml
- it: should carry apiRoutes onto the grouped rules-host policy
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
        rules:
        - host: alt.example.com
      securityPolicies:
        oidc-protected-default:
          oidc:
            clientID: my-client-id
            provider:
              issuer: https://auth.example.com
            skipAuth:
            - path: /healthz
            apiRoutes:
            - path: /api
          cors:
            enabled: true
            allowOrigins:
            - https://api.example.com
    services:
      service1: {}
  asserts:
  - documentIndex: 1
    equal:
      path: spec.oidc.denyRedirect.headers[3].name
      value: :path
  - documentIndex: 1
    equal:
      path: spec.oidc.denyRedirect.headers[3].value
      value: /api
  template: gateway-securitypolicy-shared.yaml
- it: should fail on an empty apiRoutes path
