- it: should scope grouped policy cookie names to the rules host
  release:
    name: release-name
    namespace: testns
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
        rules:
        - host: alt.example.com
      securityPolicies:
        oidc-protected-default:
