# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test service accounts
templates:
  - serviceaccount.yaml
tests:
  - it: creates a service account with inherited image pull secrets by default
    set:
      services:
        api: {}
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: release-name-stack-api
      - equal:
          path: imagePullSecrets[0].name
          value: core-platform-ecr
      - equal:
          path: imagePullSecrets[1].name
          value: dhi-oci-registry

  - it: does not create a service account when disabled
    set:
      global:
        serviceAccount:
          create: false
      services:
        api: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: allows the default pull secret to be disabled
    set:
      global:
        serviceAccount:
          imagePullSecrets: []
      services:
        api: {}
    asserts:
      - notExists:
          path: imagePullSecrets
