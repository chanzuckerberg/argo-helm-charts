# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test gateway skipAuth rejects regex syntax and whole-service exposure
templates:
- gateway-oidc.yaml
tests:
- it: should render a plain prefix as a PathPrefix match
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
    services:
      app:
        gateway:
          skipAuth:
          - path: /public/
            method: GET
  asserts:
  - documentIndex: 0
    equal:
      path: spec.rules[0].matches[0].path.value
      value: /public/
  - documentIndex: 0
    equal:
      path: spec.rules[0].matches[0].path.type
      value: PathPrefix

- it: should fail when a path carries regex anchors carried over from the nginx form
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
    services:
      app:
        gateway:
          skipAuth:
          - path: "^/public/"
  asserts:
  - failedTemplate:
      errorPattern: must start with /

- it: should fail when a path would shadow the protected route for every request
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
        securityPolicy: oidc-protected-default
    services:
      app:
        gateway:
          skipAuth:
          - path: /
  asserts:
  - failedTemplate:
      errorPattern: would make the whole service public
