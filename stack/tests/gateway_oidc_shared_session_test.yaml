# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test shared OIDC session across services on one hostname
templates:
  - gateway-securitypolicy-oidc-shared.yaml
tests:
  - it: should emit no shared policy for a single oidcProtected service
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        app:
          gateway:
            oidcProtected: true
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 0

  - it: should emit one policy targeting every protected route on the hostname
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        frontend:
          gateway:
            oidcProtected: true
            paths:
              - path: /
                pathType: Prefix
        backend:
          gateway:
            oidcProtected: true
            paths:
              - path: /api
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: release-name-stack-oidc
      - equal:
          path: spec.targetRefs
          value:
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: release-name-stack-backend
            - group: gateway.networking.k8s.io
              kind: HTTPRoute
              name: release-name-stack-frontend

  - it: should take redirectURL from the root-most service so the callback is served
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        frontend:
          gateway:
            oidcProtected: true
            paths:
              - path: /
                pathType: Prefix
        backend:
          gateway:
            oidcProtected: true
            paths:
              - path: /api
                pathType: Prefix
    asserts:
      - equal:
          path: spec.oidc.redirectURL
          value: https://api.example.com/oauth2/callback
      - equal:
          path: spec.oidc.logoutPath
          value: /logout

  - it: should not group services that serve different hostnames
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        frontend:
          gateway:
            oidcProtected: true
            paths:
              - path: /
                pathType: Prefix
        backend:
          gateway:
            oidcProtected: true
            host: other.example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 0

  - it: should fail when grouped services disagree on OIDC configuration
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        frontend:
          gateway:
            oidcProtected: true
            paths:
              - path: /
                pathType: Prefix
          oidcProxyGateway:
            cookieDomain: example.com
        backend:
          gateway:
            oidcProtected: true
            paths:
              - path: /api
                pathType: Prefix
    asserts:
      - failedTemplate:
          errorPattern: "share hostname api.example.com but have different oidcProxyGateway"

  - it: should group three protected services on one hostname
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        frontend:
          gateway:
            oidcProtected: true
            paths:
              - path: /
                pathType: Prefix
        backend:
          gateway:
            oidcProtected: true
            paths:
              - path: /api
                pathType: Prefix
        admin:
          gateway:
            oidcProtected: true
            paths:
              - path: /admin
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.targetRefs
          count: 3
