# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test gateway.rules hosts share one SecurityPolicy per (policy, host)
templates:
  - gateway-securitypolicy.yaml
tests:
  - it: should not emit two policies writing the same cookie name on one rule host
    set:
      global:
        ingress: {enabled: false}
        gateway: {enabled: true, host: app.example.com}
      services:
        frontend:
          gateway:
            securityPolicy: oidc-protected-default
            paths: [{path: /, pathType: Prefix}]
            rules:
              - host: alt.example.com
        backend:
          gateway:
            securityPolicy: oidc-protected-default
            paths: [{path: /api, pathType: Prefix}]
            rules:
              - host: alt.example.com
    asserts:
      - hasDocuments:
          count: 1
          documentSelector:
            path: spec.oidc.cookieNames.accessToken
            value: AccessToken-oidc-protected-default-alt-example-com
            matchMany: true

  - it: should cover both rule routes on one host with a single policy
    set:
      global:
        ingress: {enabled: false}
        gateway: {enabled: true, host: app.example.com}
      services:
        frontend:
          gateway:
            securityPolicy: oidc-protected-default
            paths: [{path: /, pathType: Prefix}]
            rules:
              - host: alt.example.com
        backend:
          gateway:
            securityPolicy: oidc-protected-default
            paths: [{path: /api, pathType: Prefix}]
            rules:
              - host: alt.example.com
    asserts:
      - hasDocuments:
          count: 1
      - lengthEqual:
          path: spec.targetRefs
          count: 2
