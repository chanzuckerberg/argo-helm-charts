# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test shared OIDC policy keeps annotations from every grouped service
templates:
  - gateway-securitypolicy-oidc-shared.yaml
tests:
  - it: should carry annotations from a non-primary service onto the shared policy
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
        oidcProxyGateway:
          clientID: my-client-id
          provider:
            issuer: https://auth.example.com
      services:
        frontend:
          annotations:
            frontend-annotation: frontend-value
          gateway:
            oidcProtected: true
            paths:
              - path: /
                pathType: Prefix
        backend:
          annotations:
            backend-annotation: backend-value
          gateway:
            oidcProtected: true
            paths:
              - path: /api
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.annotations["frontend-annotation"]
          value: frontend-value
      - equal:
          path: metadata.annotations["backend-annotation"]
          value: backend-value
