# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test Grafana dashboard
templates:
  - dashboard.yaml
set:
  global:
    grafanaDashboard:
      enabled: true
      instanceSelector:
        matchLabels:
          dashboards: central-grafana
    argusMetadata:
      stackName: test-stack
      appName: my-app
      envName: rdev
  services:
    service1:
      command: ["serve"]
tests:
  - it: should create only the dashboard, without GrafanaFolder CRs
    asserts:
      - hasDocuments:
          count: 1
      - containsDocument:
          apiVersion: grafana.integreatly.org/v1beta1
          kind: GrafanaDashboard

  - it: should put the dashboard in the env folder derived from appName and envName
    documentIndex: 0
    asserts:
      - equal:
          path: spec.folderUID
          value: my-app-rdev
      - notExists:
          path: spec.folderRef

  - it: should put the dashboard in the folder Argus sets with grafanaFolderUID
    set:
      global:
        argusMetadata:
          grafanaFolderUID: argus-managed-uid
    documentIndex: 0
    asserts:
      - equal:
          path: spec.folderUID
          value: argus-managed-uid

  - it: should lowercase the derived env folder UID
    set:
      global:
        argusMetadata:
          appName: My-App
          envName: RDev
    documentIndex: 0
    asserts:
      - equal:
          path: spec.folderUID
          value: my-app-rdev

  - it: should set allowCrossNamespaceImport on the dashboard
    documentIndex: 0
    asserts:
      - equal:
          path: spec.allowCrossNamespaceImport
          value: true

  - it: should set resyncPeriod to 5m on the dashboard
    documentIndex: 0
    asserts:
      - equal:
          path: spec.resyncPeriod
          value: 5m

  - it: should honor a resyncPeriod override
    set:
      global:
        grafanaDashboard:
          resyncPeriod: 2h
    documentIndex: 0
    asserts:
      - equal:
          path: spec.resyncPeriod
          value: 2h

  - it: should default dashboard refresh to 5m
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: '"refresh":\s*"5m"'

  - it: should honor a refresh override
    set:
      global:
        grafanaDashboard:
          refresh: 1m
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: '"refresh":\s*"1m"'

  - it: should not render when grafanaDashboard is disabled
    set:
      global:
        grafanaDashboard:
          enabled: false
        argusMetadata:
          stackName: test-stack
          appName: my-app
          envName: rdev
    asserts:
      - hasDocuments:
          count: 0

  - it: should hash the derived env folder UID when the combined name exceeds 40 chars
    set:
      global:
        argusMetadata:
          appName: this-is-a-very-long-application-name-that-exceeds-forty-characters
          envName: staging
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.folderUID
          pattern: "^[a-f0-9]{40}$"

  - it: should disable auto-refresh via empty string
    set:
      global:
        grafanaDashboard:
          refresh: ""
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: '"refresh":\s*""'

  - it: should use nginx metrics for an ingress-only service
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: 'nginx_ingress_controller_requests'
      - notMatchRegex:
          path: spec.json
          pattern: 'envoy_cluster_upstream_rq'

  - it: should use envoy metrics instead of nginx for a gateway-routed service
    set:
      services:
        service1:
          gateway:
            enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: 'envoy_cluster_upstream_rq_xx'
      - notMatchRegex:
          path: spec.json
          pattern: 'nginx_ingress_controller'

  - it: should scope envoy metrics to the service HTTPRoute and dedupe duplicate scrapes
    set:
      services:
        service1:
          gateway:
            enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: 'container=\\"envoy\\"'
      - matchRegex:
          path: spec.json
          pattern: 'envoy_cluster_name=~\\"httproute/\$namespace/[A-Za-z0-9-]+-service1\(-rule-\[0-9\]\+\)\?/rule/\.\*\\"'

  - it: should convert envoy latency from milliseconds to seconds
    set:
      services:
        service1:
          gateway:
            enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: 'envoy_cluster_upstream_rq_time_count.*?\\n/ 1000'

  - it: should emit both nginx and envoy targets while coexisting
    set:
      services:
        service1:
          ingress:
            enabled: true
          gateway:
            enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: 'nginx_ingress_controller_requests'
      - matchRegex:
          path: spec.json
          pattern: 'envoy_cluster_upstream_rq_xx'

  - it: should render no routing panels when neither ingress nor gateway is enabled
    set:
      services:
        service1:
          ingress:
            enabled: false
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: spec.json
          pattern: 'nginx_ingress_controller'
      - notMatchRegex:
          path: spec.json
          pattern: 'envoy_cluster_upstream_rq'
      - notMatchRegex:
          path: spec.json
          pattern: '"title":\s*"Success %"'

  - it: should include extra-host rule routes in the envoy selector
    set:
      services:
        service1:
          gateway:
            enabled: true
            rules:
              - host: extra.example.com
    documentIndex: 0
    asserts:
      - matchRegex:
          path: spec.json
          pattern: '\(-rule-\[0-9\]\+\)\?/rule/'
