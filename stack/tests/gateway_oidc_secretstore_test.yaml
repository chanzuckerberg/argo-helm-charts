# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test gateway OIDC kubernetes SecretStore
templates:
  - gateway-oidc-secretstore.yaml
tests:
  - it: renders no SecretStore when gateway is not oidcProtected
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a SecretStore when global gateway is oidcProtected
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
          oidcProtected: true
      services:
        service1: {}
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        isKind:
          of: SecretStore
      - documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-stack-kubernetes-local
      - documentIndex: 0
        equal:
          path: spec.provider.kubernetes.server.caProvider.type
          value: ConfigMap
      - documentIndex: 0
        equal:
          path: spec.provider.kubernetes.server.caProvider.name
          value: kube-root-ca.crt
      - documentIndex: 0
        equal:
          path: spec.provider.kubernetes.auth.serviceAccount.name
          value: external-secrets-sa
      - documentIndex: 0
        equal:
          path: spec.provider.kubernetes.auth.serviceAccount.namespace
          value: external-secrets

  - it: renders a SecretStore when a service-level oidcProtected is set
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
      services:
        service1:
          gateway:
            oidcProtected: true
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        isKind:
          of: SecretStore

  - it: renders only one SecretStore even when multiple services are oidcProtected
    set:
      global:
        ingress:
          enabled: false
        gateway:
          enabled: true
          host: api.example.com
          oidcProtected: true
      services:
        service1: {}
        service2: {}
    asserts:
      - hasDocuments:
          count: 1
