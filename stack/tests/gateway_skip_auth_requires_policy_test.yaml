# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test gateway.skipAuth and skipAuthPreserveAuthorization need a policy and each other
templates:
- gateway-securitypolicy.yaml
- httproute.yaml
- ingress.yaml
tests:
- it: should fail when skipAuth is listed on a gateway service with no securityPolicy
  template: gateway-securitypolicy.yaml
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
    services:
      app:
        gateway:
          paths:
          - path: /
            pathType: Prefix
          skipAuth:
          - path: /health
  asserts:
  - failedTemplate:
      errorPattern: service "app" lists gateway.skipAuth paths but has no gateway.securityPolicy
- it: should fail when skipAuth is listed and securityPolicy is none
  template: gateway-securitypolicy.yaml
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
    services:
      app:
        gateway:
          securityPolicy: none
          paths:
          - path: /
            pathType: Prefix
          skipAuth:
          - path: /health
  asserts:
  - failedTemplate:
      errorPattern: service "app" lists gateway.skipAuth paths but has no gateway.securityPolicy
- it: should render the public route when skipAuth is paired with a policy
  template: httproute.yaml
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
      securityPolicies:
        ba:
          basicAuth:
            enabled: true
            secretName: creds
    services:
      app:
        gateway:
          securityPolicy: ba
          paths:
          - path: /
            pathType: Prefix
          skipAuth:
          - path: /health
  asserts:
  - hasDocuments:
      count: 2
  - documentIndex: 0
    equal:
      path: metadata.name
      value: release-name-stack-app-public
- it: should not fire for an ingress service that inherits global gateway.skipAuth
  templates:
  - ingress.yaml
  - httproute.yaml
  set:
    global:
      ingress:
        enabled: true
        host: api.example.com
      gateway:
        enabled: false
        host: api.example.com
        skipAuth:
        - path: /health
    services:
      app: {}
  asserts:
  - template: ingress.yaml
    hasDocuments:
      count: 1
  - template: httproute.yaml
    hasDocuments:
      count: 0
- it: should fail when skipAuthPreserveAuthorization is set without skipAuth paths
  template: gateway-securitypolicy.yaml
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
    services:
      app:
        gateway:
          securityPolicy: oidc-protected-default
          skipAuthPreserveAuthorization: true
          paths:
          - path: /
            pathType: Prefix
  asserts:
  - failedTemplate:
      errorPattern: service "app" sets gateway.skipAuthPreserveAuthorization but lists no gateway.skipAuth paths
- it: should accept skipAuthPreserveAuthorization together with skipAuth and a policy
  template: httproute.yaml
  set:
    global:
      ingress:
        enabled: false
      gateway:
        enabled: true
        host: api.example.com
      securityPolicies:
        ba:
          basicAuth:
            enabled: true
            secretName: creds
    services:
      app:
        gateway:
          securityPolicy: ba
          skipAuthPreserveAuthorization: true
          paths:
          - path: /
            pathType: Prefix
          skipAuth:
          - path: /health
  asserts:
  - hasDocuments:
      count: 2
  - documentIndex: 0
    equal:
      path: metadata.name
      value: release-name-stack-app-public
- it: should not fire preserveAuthorization on an ingress service
  templates:
  - ingress.yaml
  set:
    global:
      ingress:
        enabled: true
        host: api.example.com
      gateway:
        enabled: false
        skipAuthPreserveAuthorization: true
    services:
      app: {}
  asserts:
  - template: ingress.yaml
    hasDocuments:
      count: 1
