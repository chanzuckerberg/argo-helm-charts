# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test that a route only targets the oauth2-proxy when the proxy is deployed
templates:
- ingress.yaml
- httproute.yaml
- listenerset.yaml
- gateway-oidc.yaml
- gateway-securitypolicy.yaml
- oidc_proxy.yaml
tests:
- it: a gateway route inheriting ingress.oidcProtected fails when the proxy is off
  set:
    global:
      oidcProxy:
        enabled: false
    services:
      web:
        ingress:
          oidcProtected: true
        gateway:
          enabled: true
          paths:
          - path: /
            pathType: Prefix
  asserts:
  - template: listenerset.yaml
    failedTemplate:
      errorPattern: 'service "web" renders an HTTPRoute whose backend is the oauth2-proxy'
- it: coexistence is left alone, the Ingress still justifies the proxy
  set:
    global:
      oidcProxy:
        enabled: false
    services:
      web:
        ingress:
          enabled: true
          oidcProtected: true
        gateway:
          enabled: true
          dnsOwner: ingress
          paths:
          - path: /
            pathType: Prefix
  asserts:
  - template: httproute.yaml
    hasDocuments:
      count: 1
- it: an OIDC securityPolicy service renders with the proxy off
  set:
    global:
      oidcProxy:
        enabled: false
      securityPolicies:
        app-oidc:
          oidc: {}
    services:
      web:
        ingress:
          oidcProtected: true
        gateway:
          enabled: true
          securityPolicy: app-oidc
          paths:
          - path: /
            pathType: Prefix
  asserts:
  - template: gateway-oidc.yaml
    hasDocuments:
      count: 1
- it: an unprotected service renders with the proxy off
  set:
    global:
      oidcProxy:
        enabled: false
    services:
      web:
        ingress:
          oidcProtected: false
        gateway:
          enabled: true
          paths:
          - path: /
            pathType: Prefix
  asserts:
  - template: httproute.yaml
    hasDocuments:
      count: 1
- it: coexistence renders while the proxy is enabled
  set:
    global:
      oidcProxy:
        enabled: true
    services:
      web:
        ingress:
          enabled: true
          oidcProtected: true
        gateway:
          enabled: true
          dnsOwner: ingress
          paths:
          - path: /
            pathType: Prefix
  asserts:
  - template: ingress.yaml
    hasDocuments:
      count: 1
  - template: httproute.yaml
    hasDocuments:
      count: 1
- it: global.oidcProxy.port is rendered everywhere the proxy port appears
  set:
    global:
      oidcProxy:
        enabled: true
        port: 8080
    services:
      web:
        ingress:
          enabled: true
          oidcProtected: true
        gateway:
          enabled: true
          dnsOwner: ingress
          paths:
          - path: /
            pathType: Prefix
  asserts:
  - template: oidc_proxy.yaml
    documentIndex: 0
    contains:
      path: spec.template.spec.containers[0].args
      content: --http-address=0.0.0.0:8080
  - template: oidc_proxy.yaml
    documentIndex: 0
    equal:
      path: spec.template.spec.containers[0].ports[0].containerPort
      value: 8080
  - template: oidc_proxy.yaml
    documentIndex: 1
    equal:
      path: spec.ports[0].port
      value: 8080
  - template: oidc_proxy.yaml
    documentIndex: 1
    equal:
      path: spec.ports[0].targetPort
      value: 8080
  - template: oidc_proxy.yaml
    documentIndex: 2
    equal:
      path: spec.rules[0].http.paths[0].backend.service.port.number
      value: 8080
  - template: ingress.yaml
    equal:
      path: spec.rules[0].http.paths[0].backend.service.port.number
      value: 8080
  - template: httproute.yaml
    equal:
      path: spec.rules[0].backendRefs[0].port
      value: 8080
