baseDomain: "example.dev.czi.team"
awsRegion: "us-west-2"
gatewayName: "envoy-gateway"
alternateNames: []

listenerSets:
  enabled: true
  from: All
  namespaceSelector: {}

# TLS passthrough listeners on the shared Gateway (mode: Passthrough). Off by default.
# When enabled, one TLS listener is rendered per hostname; tenant TLSRoutes attach by
# hostname. Hostnames must be specific (not the cluster wildcard) to avoid SNI conflict
# with the Terminate HTTPS listener.
tlsPassthrough:
  enabled: false
  hostnames: []

serviceAccount:
  name: envoy-gateway-proxy
  annotations: {}

envoyService:
  type: ClusterIP

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

geoip:
  enabled: true
  blockedCountries:
    - "AF"
    - "BY"
    - "BF"
    - "CF"
    - "CN"
    - "CU"
    - "ER"
    - "PS"
    - "HT"
    - "HK"
    - "IR"
    - "KZ"
    - "KG"
    - "LY"
    - "ML"
    - "MM"
    - "KP"
    - "RU"
    - "SD"
    - "SS"
    - "SY"
    - "SO"
    - "TJ"
    - "UA"
    - "VE"
    - "YE"

proxyProtocol:
  enabled: true
  optional: false

hsts:
  enabled: false
  value: "max-age=31536000; includeSubDomains"

# Path-confusion handling, pinned explicitly rather than relying on the Envoy
# Gateway default so a future default change cannot silently weaken it.
path:
  enabled: true
  # How %2f, %2F, %5c, or %5C in the request path are handled. UnescapeAndRedirect
  # (the Envoy Gateway default) unescapes and 307-redirects so every hop sees the
  # decoded path. RejectRequest returns 400 for any encoded slash (stricter).
  escapedSlashesAction: UnescapeAndRedirect
  # Collapse adjacent slashes (//a to /a). On by default in Envoy; set false to disable.
  mergeSlashes: true

# When true, drop access logs for successful (2xx) responses; errors, redirects,
# and reset connections are still logged. For high-traffic clusters where 2xx
# access-log volume is significant self-ingest.
accessLog:
  omitSuccessful: false
