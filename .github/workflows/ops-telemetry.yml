name: OPS collector chart
on:
  pull_request:
    paths:
      - 'ops-telemetry/**'
      - 'scripts/ops-collector-release.py'
      - 'tools/ops-telemetry/**'
      - '.github/workflows/ops-telemetry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only-password
          POSTGRES_DB: ops_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OPS_TEST_DATABASE_URL: postgresql://postgres:local-test-only-password@localhost:5432/ops_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: python -m pip install PyYAML==6.0.3 'psycopg[binary]==3.3.2'
      - run: python -m unittest discover -s tools/ops-telemetry/tests -v
