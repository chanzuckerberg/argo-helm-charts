{{- $clusterName := required "clusterName is required" .Values.clusterName -}}
{{- $clientID := required "oidc.clientId is required" .Values.oidc.clientId -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-probe
  labels:
    app.kubernetes.io/name: tailscale-probe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-probe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-probe
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: tailscale-probe
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: probe
          image: "{{ .Values.probe.image.repository }}:{{ .Values.probe.image.tag }}"
          imagePullPolicy: {{ .Values.probe.image.pullPolicy }}
          command:
            - /bin/bash
            - /config/probe.sh
          env:
            - name: CLUSTER_NAME
              value: {{ $clusterName | quote }}
            - name: MAX_PARALLEL
              value: {{ .Values.probe.maxParallel | quote }}
            - name: PING_COUNT
              value: {{ .Values.probe.pingCount | quote }}
            - name: PING_TIMEOUT
              value: {{ .Values.probe.pingTimeout | quote }}
            - name: PROBE_INTERVAL_SECONDS
              value: {{ .Values.probe.intervalSeconds | quote }}
            - name: SSH_COMMAND
              value: {{ .Values.probe.ssh.command | quote }}
            - name: SSH_TIMEOUT_SECONDS
              value: {{ .Values.probe.ssh.timeoutSeconds | quote }}
            - name: SSH_USER
              value: {{ .Values.probe.ssh.user | quote }}
            - name: TARGET_HOSTNAME_PREFIX
              value: {{ .Values.probe.targetHostnamePrefix | quote }}
            - name: TS_CLIENT_ID
              value: {{ $clientID | quote }}
            - name: TS_HOSTNAME
              value: {{ printf "%s-%s" .Values.tailscale.hostnamePrefix $clusterName | trunc 63 | trimSuffix "-" | quote }}
            - name: TS_SOCKET
              value: /var/run/tailscale/tailscaled.sock
            - name: TS_TAG
              value: {{ .Values.tailscale.tag | quote }}
            - name: TS_TOKEN_FILE
              value: /var/run/secrets/tailscale.com/token
          readinessProbe:
            exec:
              command:
                - tailscale
                - --socket=/var/run/tailscale/tailscaled.sock
                - status
                - --peers=false
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources.probe | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            runAsUser: 0
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: metrics
              mountPath: /metrics
            - name: socket
              mountPath: /var/run/tailscale
            - name: tailscale-token
              mountPath: /var/run/secrets/tailscale.com
              readOnly: true
            - name: tmp
              mountPath: /tmp
        - name: metrics
          image: "{{ .Values.exporter.image.repository }}:{{ .Values.exporter.image.tag }}"
          imagePullPolicy: {{ .Values.exporter.image.pullPolicy }}
          args:
            - --collector.disable-defaults
            - --collector.textfile
            - --collector.textfile.directory=/metrics
            - --web.listen-address=:9100
          ports:
            - name: metrics
              containerPort: 9100
              protocol: TCP
          resources:
            {{- toYaml .Values.resources.exporter | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: metrics
              mountPath: /metrics
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: tailscale-probe
            defaultMode: 0555
        - name: metrics
          emptyDir: {}
        - name: socket
          emptyDir: {}
        - name: tailscale-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: {{ printf "api.tailscale.com/%s" $clientID | quote }}
                  expirationSeconds: {{ .Values.oidc.tokenExpirationSeconds }}
                  path: token
        - name: tmp
          emptyDir: {}
