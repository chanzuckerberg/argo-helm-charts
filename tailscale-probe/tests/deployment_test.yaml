suite: tailscale probe workload
templates:
  - templates/deployment.yaml
set:
  clusterName: test-aws
  oidc.clientId: test-client
tests:
  - it: exposes only the annotated textfile metrics endpoint
    asserts:
      - isKind:
          of: Deployment
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/scrape"]
          value: "true"
      - equal:
          path: spec.template.metadata.annotations["prometheus.io/port"]
          value: "9100"
      - equal:
          path: spec.template.spec.containers[1].args[0]
          value: --collector.disable-defaults

  - it: projects the dedicated Tailscale workload identity
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false
      - equal:
          path: spec.template.spec.volumes[3].projected.sources[0].serviceAccountToken.audience
          value: api.tailscale.com/test-client
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TS_CLIENT_ID
            value: test-client

  - it: configures the source and Reef target identity
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: CLUSTER_NAME
            value: test-aws
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TARGET_HOSTNAME_PREFIX
            value: login-reef-
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: TS_HOSTNAME
            value: tailscale-probe-test-aws
