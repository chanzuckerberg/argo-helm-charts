suite: secrets
templates:
- secrets.yaml
set:
  image: 577638397886.dkr.ecr.us-east-1.amazonaws.com/ops-telemetry@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
tests:
- it: creates separate runtime and migration secrets before workloads
  asserts:
  - hasDocuments:
      count: 2
  - equal:
      path: metadata.annotations["argocd.argoproj.io/sync-wave"]
      value: '-2'
    documentIndex: 0
  - equal:
      path: metadata.annotations["argocd.argoproj.io/sync-wave"]
      value: '-2'
    documentIndex: 1
  - equal:
      path: spec.target.name
      value: ops-telemetry-runtime
    documentIndex: 0
  - equal:
      path: spec.target.name
      value: ops-telemetry-migration
    documentIndex: 1
- it: uses the configured external secret store and prefix for both credentials
  set:
    secretStore: test-store
    secretPrefix: test/ops
  asserts:
  - equal:
      path: spec.secretStoreRef
      value:
        name: test-store
        kind: ClusterSecretStore
    documentIndex: 0
  - equal:
      path: spec.dataFrom
      value:
      - extract:
          key: test/ops/runtime
    documentIndex: 0
  - equal:
      path: spec.secretStoreRef
      value:
        name: test-store
        kind: ClusterSecretStore
    documentIndex: 1
  - equal:
      path: spec.dataFrom
      value:
      - extract:
          key: test/ops/migration
    documentIndex: 1
