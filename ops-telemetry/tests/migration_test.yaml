suite: migration
templates:
- migration.yaml
set:
  image: 577638397886.dkr.ecr.us-east-1.amazonaws.com/ops-telemetry@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
tests:
- it: runs the pinned migration image before the collector with bounded retries
  asserts:
  - equal:
      path: metadata.annotations["argocd.argoproj.io/hook"]
      value: Sync
  - equal:
      path: metadata.annotations["argocd.argoproj.io/sync-wave"]
      value: '0'
  - equal:
      path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
      value: BeforeHookCreation
  - equal:
      path: spec.backoffLimit
      value: 2
  - equal:
      path: spec.activeDeadlineSeconds
      value: 600
  - equal:
      path: spec.template.spec.restartPolicy
      value: Never
  - equal:
      path: spec.template.spec.containers[0].image
      value: 577638397886.dkr.ecr.us-east-1.amazonaws.com/ops-telemetry@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  - equal:
      path: spec.template.spec.containers[0].command
      value:
      - python
      - /migrations/migrate.py
- it: isolates migration credentials and mounts migration and TLS inputs read-only
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env
      value:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: ops-telemetry-migration
            key: database-url
      - name: RUNTIME_PASSWORD
        valueFrom:
          secretKeyRef:
            name: ops-telemetry-migration
            key: runtime-password
  - equal:
      path: spec.template.spec.containers[0].volumeMounts
      value:
      - name: migrations
        mountPath: /migrations
        readOnly: true
      - name: rds-ca
        mountPath: /etc/ops-rds-ca
        readOnly: true
  - equal:
      path: spec.template.spec.automountServiceAccountToken
      value: false
